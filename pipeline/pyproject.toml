[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precipitation"
version = "0.1.0"
description = "India precipitation forecast pipeline built on ECMWF Open Data"
requires-python = ">=3.11"
dependencies = [
    "ecmwf-opendata>=0.3.19",
    "eccodes>=2.37",
    "cfgrib>=0.9.10",
    "xarray>=2024.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
precipitation = "precipitation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
