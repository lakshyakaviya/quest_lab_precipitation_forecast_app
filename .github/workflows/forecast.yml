name: Build and deploy forecast

# ECMWF publishes open data 7-9 hours after each run. The day-15 IFS forecast only
# exists at 00z and 12z, so the schedule targets those two: 09:30 UTC picks up the 00z
# run, 21:30 UTC the 12z run. `fetch.latest_run` resolves the newest *complete* run
# rather than trusting the clock, so a late dissemination degrades to republishing the
# previous run instead of failing.
# GitHub queues scheduled workflows behind on-demand jobs and routinely runs them late
# — the 21:30 UTC run fired 4.5 hours behind on 2026-11-12. Each cycle therefore gets
# a second attempt two hours later. A catch-up run that finds the same forecast simply
# republishes identical content, which is harmless, and Actions minutes are free on a
# public repository.
on:
  schedule:
    - cron: "30 9 * * *" # 00z run, published ~07-09 UTC
    - cron: "30 11 * * *" # catch-up
    - cron: "30 21 * * *" # 12z run, published ~19-21 UTC
    - cron: "30 23 * * *" # catch-up
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let a scheduled run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pipeline
        run: python -m pip install --upgrade pip && pip install -e "./pipeline[dev]"

      - name: Run pipeline tests
        working-directory: pipeline
        run: pytest -q

      # Both models, resolved to the newest run they share so the comparison is
      # like for like. AIFS publishes sooner and runs all four cycles, IFS reaches
      # day 15 only at 00z and 12z, so the run is aligned down to IFS.
      - name: Build the forecast cubes
        run: python -m precipitation.cli run --model ifs --model aifs --out web/public/data

      - name: Verify published data
        run: python .github/scripts/verify_data.py web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and run front-end assertions
        working-directory: web
        run: npm run check

      - name: Build the web app
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
